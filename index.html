<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAV to MP3 Converter | 最高品質320kbps変換</title>
    <meta
      name="description"
      content="複数のWAVファイルをブラウザ上で最高品質320kbpsのMP3形式へ一括変換できるウェブアプリです。"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <div class="hero__content">
          <p class="hero__eyebrow">Batch Audio Converter</p>
          <h1 id="app-title">WAVを高音質MP3へ一括変換</h1>
          <p class="hero__lead">
            複数のWAVファイルをまとめてアップロードし、MP3の最高品質ビットレートである320kbpsに変換します。
            変換処理はブラウザ内で完結するため、音源をサーバーへ送信しません。
          </p>
        </div>
        <div class="quality-card" aria-label="変換品質">
          <span class="quality-card__value">320</span>
          <span class="quality-card__unit">kbps</span>
          <p>MP3最高品質ビットレート</p>
        </div>
      </section>

      <section class="converter" aria-labelledby="converter-title">
        <div class="converter__header">
          <div>
            <p class="section-label">Upload WAV Files</p>
            <h2 id="converter-title">WAVファイルを選択</h2>
          </div>
          <button class="button button--ghost" id="clearButton" type="button" disabled>
            クリア
          </button>
        </div>

        <label class="drop-zone" id="dropZone">
          <input id="fileInput" type="file" accept="audio/wav,.wav" multiple />
          <span class="drop-zone__icon">♪</span>
          <span class="drop-zone__title">クリックまたはドラッグ＆ドロップ</span>
          <span class="drop-zone__text">複数のWAVファイルを同時に選択できます</span>
        </label>

        <div class="actions">
          <button class="button" id="convertButton" type="button" disabled>
            320kbps MP3に変換
          </button>
          <p class="status" id="status" role="status" aria-live="polite">
            WAVファイルを選択してください。
          </p>
        </div>

        <ul class="file-list" id="fileList" aria-label="選択されたファイル"></ul>
      </section>
    </main>
  </body>
</html>
